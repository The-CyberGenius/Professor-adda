<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Zero Cache Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Soon - Professor Adda</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        .update-soon {
            font-size: 2.2rem;
            font-weight: bold;
            color: #f59e42;
            letter-spacing: 2px;
            animation: pulse 1.2s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.08); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <custom-navbar></custom-navbar>
    <main class="flex-1 flex flex-col items-center justify-center">
        <div class="flex flex-col items-center justify-center h-full py-24">
            <i data-feather="alert-circle" class="text-yellow-500 mb-6" style="width: 64px; height: 64px;"></i>
            <div class="update-soon">Update Soon</div>
            <p class="mt-4 text-gray-500 text-lg">This feature/page will be available soon. Stay tuned!</p>
        </div>
    </main>
    <custom-footer></custom-footer>
    <script src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../script.js"></script>
    <script>
        if (typeof feather !== 'undefined') { feather.replace(); }
    </script>
</body>
</html>
